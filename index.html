<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتب أنوار المصطفى | سلوم ستور</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(16px, 5vw, 56px);
  background: radial-gradient(ellipse at top, #32220f, transparent 66%), #100f0e;
  color: #fff1dd;
  font-family: Tahoma, Arial, sans-serif;
}
main { width: min(100%, 72rem); }
h1 { margin: 0 0 1em; text-align: center; font-size: clamp(1.4rem, 4vw, 3rem); line-height: 1.55; }
.backdrops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 3vw, 28px); align-items: center; }
.backdrop {
  border: 1px solid #bf843b80;
  border-radius: 16px;
  background: #0b0b0b center / contain no-repeat;
  box-shadow: 0 15px 40px #0006;
}
.anwar { aspect-ratio: 1536 / 664; background-image: url("anwar.webp"); }
.slom { aspect-ratio: 3 / 2; background-image: url("slom.webp"); }
@media (max-width: 680px) { .backdrops { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>مكتب أنوار المصطفى | سلوم ستور</h1>
  <div class="backdrops">
    <div class="backdrop anwar" role="img" aria-label="لافتة مكتب أنوار المصطفى"></div>
    <div class="backdrop slom" role="img" aria-label="لافتة سلوم ستور"></div>
  </div>
</main>
</body>
</html>
